<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Splash Screen Stylings */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #455F71;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .splash-logo {
            max-width: 320px;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.2));
            animation: fadeInScale 1.2s ease-out forwards;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="dashboard-body">
    <!-- Splash Screen -->
    <div id="splash-screen">
        <img src="assets/chickin_logo.png" alt="Chickin Logo" class="splash-logo">
    </div>
    <div class="dashboard-container">
        <div class="icon-grid">
            <a href="drive.html" class="grid-item">
                <div class="icon-wrapper">
                    <img src="assets/logo_drive.png" alt="Drive Logo" class="app-logo">
                </div>
                <span>Drive Connector</span>
            </a>
            <!-- MQTT Connector -->
            <a href="mqtt.html" class="grid-item">
                <div class="icon-wrapper">
                    <img src="assets/logo_mqtt.png" alt="MQTT Logo" class="app-logo">
                </div>
                <span>MQTT Connector</span>
            </a>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Splash Screen Logic
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.add('fade-out');
                    setTimeout(() => {
                        splash.style.display = 'none';
                    }, 800);
                }
            }, 3000); // 3 Seconds
        });
    </script>
</body>

</html>
